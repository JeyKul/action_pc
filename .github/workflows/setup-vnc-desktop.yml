name: Setup Ubuntu Desktop with VNC

on:
  workflow_dispatch:

jobs:
  setup-vnc-desktop:
    runs-on: ubuntu-latest

    steps:
    - name: Set up lightweight desktop and VNC server
      run: |
        # Update and install necessary packages
        sudo apt update && sudo apt upgrade -y
        
        # Install XFCE4 desktop environment
        sudo apt install -y xfce4 xfce4-goodies
        
        # Install TigerVNC server
        sudo apt install -y tigervnc-standalone-server tigervnc-common
        
        # Configure VNC server
        mkdir -p ~/.vnc
        echo "password" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

        # Create a VNC startup script
        cat <<EOF > ~/.vnc/xstartup
        #!/bin/bash
        xrdb $HOME/.Xresources
        startxfce4 &
        EOF
        chmod +x ~/.vnc/xstartup

        # Start VNC server on port 5901
        vncserver :1

    - name: Open VNC port via ngrok (for access)
      run: |
        # Install ngrok
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip
        unzip ngrok-stable-linux-amd64.zip
        sudo mv ngrok /usr/local/bin/

        # Start ngrok on VNC port
        nohup ngrok tcp 5901 > /dev/null 2>&1 &
        
        # Wait for ngrok to initialize
        sleep 5
        
        # Display the ngrok public URL
        curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'

    - name: Output VNC connection info
      run: |
        echo "Connect to the VNC server using the displayed ngrok URL on port 5901."
