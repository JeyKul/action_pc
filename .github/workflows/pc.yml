name: Setup Minimal Ubuntu Desktop with VPN, VNC, and SSH

on:
  workflow_dispatch:
    inputs:
      vpn_profile:
        description: "Base64-encoded OpenVPN profile (.ovpn file)"
        required: true

jobs:
  setup-vpn-vnc-ssh:
    runs-on: ubuntu-latest

    steps:
    - name: Decode and set up VPN profile
      run: |
        # Decode the provided VPN profile and save it
        echo "${{ inputs.vpn_profile }}" | base64 -d > vpn.ovpn
        chmod 600 vpn.ovpn

        # Install OpenVPN, ssh server and start the VPN connection
        whoami
        sudo apt update && sudo apt install -y openvpn openssh-server
        # start ssh
        sudo systemctl enable ssh
        sudo systemctl start ssh
        # generate key
        if [ ! -f ~/.ssh/id_rsa ]; then
          ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
        fi
        # print key
        echo "SSH Public Key:"
        cat ~/.ssh/id_rsa.pub

        sudo openvpn --config vpn.ovpn --daemon

        # Verify VPN connectivity
        sleep 10
        if curl -s https://api.ipify.org; then
          echo "VPN connection established. Public IP updated."
        else
          echo "VPN connection failed. Exiting."
          exit 1
        fi

    - name: Install minimal desktop and VNC
      run: |
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y openbox x11-utils xinit tigervnc-standalone-server tigervnc-common xterm

    - name: Configure VNC server
      run: |
        mkdir -p ~/.vnc
        echo "password" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

        cat <<EOF > ~/.vnc/xstartup
        #!/bin/bash
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec openbox-session &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Start VNC server
      run: |
        vncserver -geometry 1280x800 :1 || echo "VNC failed to start"

    - name: Debugging Loop
      run: |
        echo "Setup complete. Keeping the environment active for debugging."
        while true; do sleep 60; done
