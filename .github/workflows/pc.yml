name: Setup Minimal Ubuntu Desktop with VNC and SSH

on:
  workflow_dispatch:

jobs:
  setup-vnc-ssh:
    runs-on: ubuntu-latest

    steps:
    - name: Install minimal desktop and VNC
      run: |
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y openbox x11-utils xinit tigervnc-standalone-server tigervnc-common xterm

    - name: Configure VNC server
      run: |
        mkdir -p ~/.vnc
        echo "password" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

        cat <<EOF > ~/.vnc/xstartup
        #!/bin/bash
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec openbox-session &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Start VNC server
      run: |
        vncserver -geometry 1280x800 :1 || echo "VNC failed to start"

    - name: Install and start SSH server
      run: |
        sudo apt install -y openssh-server
        sudo systemctl enable ssh
        sudo systemctl start ssh
        echo "SSH is running. You can connect using the public IP and default port (22)."

    - name: Install and start ngrok
      run: |
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip
        unzip ngrok-stable-linux-amd64.zip
        sudo mv ngrok /usr/local/bin/

        # Start ngrok for VNC (5901) and SSH (22)
        nohup ngrok tcp 5901 > /dev/null 2>&1 &
        nohup ngrok tcp 22 > /dev/null 2>&1 &
        
        # Wait for ngrok to initialize
        sleep 10

        # Fetch and display ngrok public URLs
        echo "Fetching ngrok public URLs:"
        if curl -s localhost:4040/api/tunnels | jq -r '.tunnels[] | "\(.name): \(.public_url)"'; then
          echo "ngrok URLs fetched successfully."
        else
          echo "Failed to fetch ngrok URLs. Retrying..."
          sleep 5
          curl -s localhost:4040/api/tunnels | jq -r '.tunnels[] | "\(.name): \(.public_url)"'
        fi

    - name: Keep workflow running for debugging
      run: |
        echo "Setup complete. Keeping the environment active for debugging."
        while true; do sleep 60; done
