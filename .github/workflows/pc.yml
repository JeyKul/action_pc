name: Setup Ubuntu Desktop with VNC

on:
  workflow_dispatch:

jobs:
  setup-vnc-desktop:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y xfce4 xfce4-goodies tigervnc-standalone-server tigervnc-common xterm

    - name: Configure VNC server
      run: |
        mkdir -p ~/.vnc
        echo "password" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd

        # Minimal xstartup file
        cat <<EOF > ~/.vnc/xstartup
        #!/bin/bash
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec startxfce4 &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Start VNC server
      run: |
        vncserver -geometry 1280x800 :1

    - name: Install and start ngrok
      run: |
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip
        unzip ngrok-stable-linux-amd64.zip
        sudo mv ngrok /usr/local/bin/
        nohup ngrok tcp 5901 > /dev/null 2>&1 &
        sleep 5
        curl -s localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
